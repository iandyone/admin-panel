services:
  ui:
    working_dir: /app/services/admin-panel-ui
    build:
      target: dev
    image: admin-panel-ui-dev
    env_file:
      - .env.local

    develop:
      watch:
        - path: ./package.json
          action: rebuild

        - path: ./yarn.lock
          action: rebuild

        - path: ./services/admin-panel-ui/package.json
          action: rebuild

        - path: ./services/admin-panel-ui
          target: /app/services/admin-panel-ui/
          action: sync
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - package.json

        - path: ./configs
          target: /app/configs
          action: sync+restart
          initial_sync: true
          ignore:
            - node_modules/

    # command: yarn workspace @services/admin-panel-ui dev
  api:
    build:
      target: dev
    image: admin-panel-api-dev
    env_file:
      - .env.local
    develop:
      watch:
        - path: ./package.json
          action: rebuild

        - path: ./yarn.lock
          action: rebuild

        - path: ./services/admin-panel-api/package.json
          action: rebuild

        - path: ./services/admin-panel-api
          target: /app/services/admin-panel-api/
          action: sync
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - coverage/
            - '*.tsbuildinfo'
            - package.json
            - prisma/

        - path: ./services/admin-panel-api/prisma
          target: /app/services/admin-panel-api/prisma
          action: sync+restart
          initial_sync: true

        - path: ./configs
          target: /app/configs
          action: sync+restart
          initial_sync: true
          ignore:
            - node_modules/
